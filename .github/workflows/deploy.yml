# Deploys main to Cloudflare Pages after the full CI suite passes.
# With branch protection on main (pull requests + required review + required CI), only approved
# changes reach the website. Setup: docs/DEPLOYMENT.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloudflare Pages
    needs: ci
    # Skipped (not failed) until the repository is configured, so forks stay green.
    if: ${{ vars.D1_DATABASE_ID != '' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME || 'voicesbar' }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      # Pasted secrets often carry a trailing newline or spaces, which Cloudflare rejects.
      - name: Clean up pasted credentials
        run: |
          token="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          account="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Point wrangler.toml at the production database and project
        run: |
          sed -i "s/00000000-0000-0000-0000-000000000000/${D1_DATABASE_ID}/" wrangler.toml
          sed -i "s/^name = \".*\"/name = \"${PROJECT_NAME}\"/" wrangler.toml
          grep -q "${D1_DATABASE_ID}" wrangler.toml

      - name: Create the Pages project on first deploy
        run: |
          if ! npx wrangler pages project list | grep -qw "${PROJECT_NAME}"; then
            npx wrangler pages project create "${PROJECT_NAME}" --production-branch main
          fi

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy
        run: npx wrangler pages deploy dist --project-name "${PROJECT_NAME}" --branch main --commit-hash "${GITHUB_SHA}" --commit-message "Deploy ${GITHUB_SHA::7}"
