# Pushing a tag such as v0.1.0 runs the checks and publishes a GitHub Release with the built site.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package the static site and functions
        run: zip -r "whispertocursor-${GITHUB_REF_NAME}.zip" dist functions server shared migrations wrangler.toml package.json package-lock.json README.md LICENSE
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "whispertocursor-${GITHUB_REF_NAME}.zip" --title "${GITHUB_REF_NAME}" --generate-notes
